<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0bb7df">
  <meta name="description" content="E-CityHub — PR, advertising, news, events, reels and creative media.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="styles.css">
  <title>E-CityHub</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰</button>
    <a class="brand" href="#home" data-route>
      <img src="logo.png" alt="E-CityHub logo">
      <span>E-CityHub</span>
    </a>
    <button class="icon-btn" id="installBtn" hidden aria-label="Install app">＋</button>
  </header>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head"><strong>E-CityHub</strong><button class="icon-btn" id="closeMenu">×</button></div>
    <nav>
      <a href="#home" data-route>Home</a>
      <a href="#news" data-route>News Updates</a>
      <a href="#events" data-route>Events</a>
      <a href="#reels" data-route>Reels</a>
      <a href="#services" data-route>Services</a>
      <a href="#ads" data-route>Featured Ads</a>
      <a href="#advertise" data-route>Advertise With Us</a>
      <a href="#about" data-route>About</a>
      <a href="#contact" data-route>Contact</a>
      <a href="#admin" data-route>Admin</a>
    </nav>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main id="main"></main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="#home" data-route><span>⌂</span><small>Home</small></a>
    <a href="#news" data-route><span>▤</span><small>News</small></a>
    <a href="#events" data-route><span>◉</span><small>Events</small></a>
    <a href="#reels" data-route><span>▶</span><small>Reels</small></a>
    <a href="#advertise" data-route class="nav-cta"><span>＋</span><small>Advertise</small></a>
  </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("EkuCityHub service worker registered"))
      .catch(err => console.error("Service worker error:", err));
  });
}
</script>
</body>
</html>
